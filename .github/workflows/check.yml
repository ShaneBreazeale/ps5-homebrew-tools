name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.x'
          - os: macos-latest
            python: '3.x'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Host tests only: no SDK, payload build, or console connection.
      - run: make check
      - run: make native-check
        env:
          CXX: clang++

  payloads:
    name: Reference payload build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned Ubuntu 24.04 clang 18.1.3 and SDK archive; see tooling/container.
      - run: make container-build
      - uses: actions/upload-artifact@v4
        with:
          name: payloads
          path: |
            out/*.elf
            out/SHA256SUMS
